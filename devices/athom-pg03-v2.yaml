# Athom PG03 V2 smart plug (ESP8266, CSE7766 power monitoring), used as a normal plug.
packages:
  base: !include ../common/base.yaml
  wifi: !include ../common/wifi.yaml

substitutions:
  # Default name
  name: "athom-pg03-v2"
  # Default friendly name
  friendly_name: "PG03 V2 Plug"
  # Allows ESP device to be automatically linked to an 'Area' in Home Assistant
  room: ""
  # Description as appears in ESPHome & top of webserver page
  device_description: "Athom PG03 V2 smart plug"
  # Project Name
  project_name: "Athom.PG03-V2"
  # Release version of this yaml file
  project_version: "v1.0.0"
  # Icon for the plug's on/off switch
  relay_icon: "mdi:power-socket-us"
  # Restore the relay upon reboot to state:
  relay_restore_mode: RESTORE_DEFAULT_OFF
  # Power sensor reporting interval
  update_interval: 60s

esphome:
  comment: "${device_description}"
  area: "${room}"
  project:
    name: "${project_name}"
    version: "${project_version}"
  on_boot:
    - priority: 600
      then:
        - select.set_index:
            id: power_mode
            index: !lambda |-
                    return id(restore_mode)-1;
        - lambda: |-
              switch(id(restore_mode))
              {
              case 1:{
                      id(relay).turn_off();
                      break;
                            }
              case 2:{
                      id(relay).turn_on();
                      break;
                            }
              default:{
                      break;
                            }
              }

esp8266:
  board: esp01_1m
  # Keep saved settings (relay state, Power On State) through a power cut
  restore_from_flash: true

select:
  - platform: template
    name: "Power On State"
    id: "power_mode"
    # Default: keep the plug as it was before power was lost
    initial_option: Restore Power Off State
    restore_value: true
    optimistic: true
    options:
      - Always Off
      - Always On
      - Restore Power Off State
    on_value:
      then:
        - lambda: |-
            id(restore_mode)=i+1;

globals:
  - id: restore_mode
    type: int
    restore_value: yes
    initial_value: "3"
  - id: total_energy
    type: float
    restore_value: yes
    initial_value: '0.0'

# The CSE7766 power chip is on the hardware UART RX (logging is off it: baud_rate 0 in base)
uart:
  rx_pin: RX
  baud_rate: 4800
  parity: EVEN

binary_sensor:
  # Plug button: click toggles the relay, hold 8 s for a factory reset
  - platform: gpio
    pin:
      number: 5
      mode: INPUT_PULLUP
      inverted: true
    name: "Power Button"
    id: button1
    disabled_by_default: true
    filters:
      - delayed_on_off: 20ms
    # Toggle the instant the button is released (press up to 1 s, no extra wait).
    on_click:
      min_length: 0ms
      max_length: 1s
      then:
        - switch.toggle: relay
    on_multi_click:
      - timing:
          - ON for at least 8s
        then:
          - button.press: Reset

switch:
  - platform: gpio
    name: None
    icon: "${relay_icon}"
    pin: GPIO12
    id: relay
    restore_mode: ${relay_restore_mode}

sensor:
  - platform: cse7766
    current:
      name: "Current"
      filters:
          - lambda: if (x < 0.060) return 0.0; else return x;   #For the chip will report less than 3w power when no load is connected
          - throttle_average: ${update_interval}
    voltage:
      name: "Voltage"
      filters:
        - throttle_average: ${update_interval}
    power:
      name: "Power"
      id: power_sensor
      filters:
          - lambda: if (x < 3.0) return 0.0; else return x;    #For the chip will report less than 3w power when no load is connected
          - throttle_average: ${update_interval}

    energy:
      name: "Energy"
      id: energy
      unit_of_measurement: kWh
      filters:
        # Multiplication factor from W to kW is 0.001
        - multiply: 0.001
        - throttle_average: ${update_interval}
      on_value:
        then:
          - lambda: |-
              static float previous_energy_value = 0.0;
              float current_energy_value = id(energy).state;
              id(total_energy) += current_energy_value - previous_energy_value;
              previous_energy_value = current_energy_value;

  - platform: template
    name: "Total Energy"
    unit_of_measurement: kWh
    device_class: "energy"
    state_class: "total_increasing"
    icon: "mdi:lightning-bolt"
    accuracy_decimals: 3
    lambda: |-
      return id(total_energy);
    update_interval: ${update_interval}

  - platform: total_daily_energy
    name: "Total Daily Energy"
    restore: true
    power_id: power_sensor
    unit_of_measurement: kWh
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

dashboard_import:
  package_import_url: github://avandeweghe/esphome_config/devices/athom-pg03-v2.yaml@main
