# Athom 2-channel energy monitor (ESP32-C3 + BL0906)
# Based on athom-tech/esp32-configs athom-energy-monitor-x2.yaml (v3.0.7)
# https://github.com/athom-tech/esp32-configs
packages:
  base: !include ../common/base.yaml
  wifi: !include ../common/wifi.yaml
  esp32: !include ../common/esp32.yaml
  bt_proxy: !include ../common/bt-proxy.yaml
  improv: !include ../common/improv.yaml

substitutions:
  # Default name
  name: "athom-em-2"
  # Default friendly name
  friendly_name: "Athom Energy Meter"
  # Allows ESP device to be automatically linked to an 'Area' in Home Assistant
  room: ""
  # Description as appears in ESPHome & top of webserver page
  device_description: "athom bl0906 energy meter (2 channels)"
  # Project Name
  project_name: "Athom.Energy-Monitor-x2"
  # Release version of this yaml file
  project_version: "v3.0.7"
  # How often the BL0906 is read
  update_interval: 5s

  # ESP32-C3 pins
  bl0906_tx_pin: GPIO7
  bl0906_rx_pin: GPIO8
  button_pin: GPIO9
  led_pin: GPIO10

esphome:
  comment: "${device_description}"
  area: "${room}"
  name_add_mac_suffix: true
  project:
    name: "${project_name}"
    version: "${project_version}"

esp32:
  board: esp32-c3-devkitm-1
  flash_size: 4MB
  flash_mode: dio
  variant: ESP32C3
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      # @grigi found in testing that these options resulted in better responsiveness.
      # BLE 4.2 is supported by ALL ESP32 boards that have bluetooth, the original and derivatives.
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: y
      # Also enable this on any derivative boards (S2, C3 etc) but not the original ESP32.
      CONFIG_BT_BLE_50_FEATURES_SUPPORTED: y
      # Extend the watchdog timeout, so the device reboots if the device appears locked up for over 10 seconds.
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "10"

dashboard_import:
  package_import_url: github://avandeweghe/esphome_config/devices/athom-energy-monitor-x2.yaml@main

# Energy totals survive reboots and BL0906 counter resets (the chip's counters restart at 0 on power loss)
globals:
  - id: id_Energy_sum_persist
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: id_Energy_sum_lastvalue
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: id_Energy_1_persist
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: id_Energy_1_lastvalue
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: id_Energy_2_persist
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: id_Energy_2_lastvalue
    type: float
    restore_value: no
    initial_value: '0.0'

uart:
  tx_pin: "${bl0906_tx_pin}"
  rx_pin: "${bl0906_rx_pin}"
  baud_rate: 19200
  id: uart_bl0906

light:
  - platform: status_led
    name: "Status LED"
    id: blue_led
    disabled_by_default: true
    pin: "${led_pin}"

binary_sensor:
  - platform: gpio
    pin:
      number: "${button_pin}"
      mode: INPUT_PULLUP
      inverted: true
    name: "Power Button"
    disabled_by_default: true
    id: power_button
    filters:
      - delayed_on_off: 20ms
    on_multi_click:
      # Hold 8 s for a factory reset
      - timing:
          - ON for at least 8s
        then:
          - button.press: Reset

sensor:
  - platform: bl0906
    id: id_bl0906
    update_interval: "${update_interval}"
    frequency:
      name: 'Frequency'
      id: 'Frequency'
    temperature:
      name: 'Temperature'
      id: 'Temperature'
    voltage:
      name: 'Voltage'
      id: 'Voltage'
    channel_1:
      current:
        name: 'Current_1'
        id: 'Current_1'
      power:
        name: 'Power_1'
        id: 'Power_1'
      energy:
        id: 'Energy_1'
        name: 'Energy_1_Internal'
        internal: true
    channel_2:
      current:
        name: 'Current_2'
        id: 'Current_2'
      power:
        name: 'Power_2'
        id: 'Power_2'
      energy:
        id: 'Energy_2'
        name: 'Energy_2_Internal'
        internal: true
    total_energy:
      name: 'Total_Energy'
      id: 'Energy_sum'
      internal: true
    total_power:
      name: 'Total_Power'
      id: 'Total_Power'

  - platform: copy
    name: 'Total_Energy'
    id: Energy_sum_persist
    source_id: Energy_sum
    state_class: total_increasing
    filters:
      - lambda: |-
          if(id(id_Energy_sum_lastvalue) == 0.0  )
          {
            id(id_Energy_sum_lastvalue) = id(Energy_sum).state;
          }
          if(x < id(id_Energy_sum_persist))
          {
            float delta =  x - id(id_Energy_sum_lastvalue);
            id(id_Energy_sum_persist) += delta;
            id(id_Energy_sum_lastvalue) = x;
          }
          else
          {
            id(id_Energy_sum_persist) = x;
          }
          return id(id_Energy_sum_persist);

  - platform: copy
    name: 'Energy_1'
    id: Energy_1_persist
    source_id: Energy_1
    state_class: total_increasing
    filters:
      - lambda: |-
          if(id(id_Energy_1_lastvalue) == 0.0  )
          {
            id(id_Energy_1_lastvalue) = id(Energy_1).state;
          }
          if(x < id(id_Energy_1_persist))
          {
            float delta =  x - id(id_Energy_1_lastvalue);
            id(id_Energy_1_persist) += delta;
            id(id_Energy_1_lastvalue) = x;
          }
          else
          {
            id(id_Energy_1_persist) = x;
          }
          return id(id_Energy_1_persist);

  - platform: copy
    name: 'Energy_2'
    id: Energy_2_persist
    source_id: Energy_2
    state_class: total_increasing
    filters:
      - lambda: |-
          if(id(id_Energy_2_lastvalue) == 0.0  )
          {
            id(id_Energy_2_lastvalue) = id(Energy_2).state;
          }
          if(x < id(id_Energy_2_persist))
          {
            float delta =  x - id(id_Energy_2_lastvalue);
            id(id_Energy_2_persist) += delta;
            id(id_Energy_2_lastvalue) = x;
          }
          else
          {
            id(id_Energy_2_persist) = x;
          }
          return id(id_Energy_2_persist);

button:
  - platform: template
    name: Reset Energy
    id: template_reset_energy
    entity_category: config
    on_press:
      then:
        - globals.set:
            id: id_Energy_1_persist
            value: '0.0'
        - globals.set:
            id: id_Energy_2_persist
            value: '0.0'
        - globals.set:
            id: id_Energy_sum_persist
            value: '0.0'
        - bl0906.reset_energy: id_bl0906
