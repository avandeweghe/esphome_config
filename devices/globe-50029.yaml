# Globe Electric 2-Outlet Outdoor Plug 50029 (ESP8266).
# One button: short press (< 0.4 s) toggles outlet 1, longer press (0.5-5 s)
# toggles outlet 2, hold 8 s for a factory reset.
# Pins: GPIO12 button, GPIO13/GPIO4 relays, GPIO14/GPIO3 outlet LEDs.
# https://devices.esphome.io/devices/globe-outdoor-plug-50029/
packages:
  base: !include ../common/base.yaml
  wifi: !include ../common/wifi.yaml

substitutions:
  # Default name
  name: "globe-50029"
  # Default friendly name
  friendly_name: "Outdoor Plug"
  # Allows ESP device to be automatically linked to an 'Area' in Home Assistant
  room: ""
  # Description as appears in ESPHome & top of webserver page
  device_description: "Globe Electric 2-outlet outdoor plug 50029"
  # Project Name
  project_name: "Globe.50029"
  # Release version of this yaml file
  project_version: "v1.0.0"
  # Names of the two channels in Home Assistant
  ch1_name: "Outlet 1"
  ch2_name: "Outlet 2"

esphome:
  comment: "${device_description}"
  area: "${room}"
  project:
    name: "${project_name}"
    version: "${project_version}"
  on_boot:
    - priority: 600
      then:
        - select.set_index:
            id: power_mode1
            index: !lambda 'return id(restore_mode1)-1;'
        - select.set_index:
            id: power_mode2
            index: !lambda 'return id(restore_mode2)-1;'
        - lambda: |-
            if (id(restore_mode1) == 1) id(ch1).turn_off();
            if (id(restore_mode1) == 2) id(ch1).turn_on();
            if (id(restore_mode2) == 1) id(ch2).turn_off();
            if (id(restore_mode2) == 2) id(ch2).turn_on();

esp8266:
  board: esp01_1m
  # Keep saved settings (on/off states, Power On State) through a power cut
  restore_from_flash: true

globals:
  - id: restore_mode1
    type: int
    restore_value: yes
    initial_value: "3"
  - id: restore_mode2
    type: int
    restore_value: yes
    initial_value: "3"

select:
  - platform: template
    name: "${ch1_name} Power On State"
    id: power_mode1
    # Default: keep it as it was before power was lost
    initial_option: Restore Power Off State
    restore_value: true
    optimistic: true
    options:
      - Always Off
      - Always On
      - Restore Power Off State
    on_value:
      then:
        - lambda: 'id(restore_mode1) = i + 1;'
  - platform: template
    name: "${ch2_name} Power On State"
    id: power_mode2
    # Default: keep it as it was before power was lost
    initial_option: Restore Power Off State
    restore_value: true
    optimistic: true
    options:
      - Always Off
      - Always On
      - Restore Power Off State
    on_value:
      then:
        - lambda: 'id(restore_mode2) = i + 1;'

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO12
      inverted: True
    id: button1
    on_multi_click:
      # Short press: outlet 1
      - timing:
          - ON for at most 0.4s
          - OFF for at least 0.2s
        then:
          - switch.toggle: ch1
      # Longer press: outlet 2
      - timing:
          - ON for 0.5s to 5s
          - OFF for at least 0.2s
        then:
          - switch.toggle: ch2
      # Hold 8 s: factory reset
      - timing:
          - ON for at least 8s
        then:
          - button.press: Reset

switch:
  # Outlet LEDs (internal): on while their outlet is on
  - platform: gpio
    id: led1
    pin:
      number: GPIO14
      inverted: True
  - platform: gpio
    id: led2
    pin:
      number: GPIO3
      inverted: True
  - platform: gpio
    id: ch1
    icon: mdi:power-socket-us
    pin:
      number: GPIO13
    name: "${ch1_name}"
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - switch.turn_on: led1
    on_turn_off:
      - switch.turn_off: led1
  - platform: gpio
    id: ch2
    icon: mdi:power-socket-us
    pin:
      number: GPIO4
    name: "${ch2_name}"
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - switch.turn_on: led2
    on_turn_off:
      - switch.turn_off: led2

dashboard_import:
  package_import_url: github://avandeweghe/esphome_config/devices/globe-50029.yaml@main
