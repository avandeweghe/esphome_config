# Nameless DS-102 2-gang wall switch (ESP8266), two lights.
# Each button: click toggles its light; hold 8 s for a factory reset.
# Pins: GPIO3/GPIO5 buttons, GPIO13/GPIO4 relays, GPIO14/GPIO1 button LEDs, GPIO0 status LED.
# https://devices.esphome.io/devices/nameless-ds-102/
packages:
  base: !include ../common/base.yaml
  wifi: !include ../common/wifi.yaml

substitutions:
  # Default name
  name: "nameless-ds-102"
  # Default friendly name
  friendly_name: "2-Gang Switch"
  # Allows ESP device to be automatically linked to an 'Area' in Home Assistant
  room: ""
  # Description as appears in ESPHome & top of webserver page
  device_description: "Nameless DS-102 2-gang wall switch"
  # Project Name
  project_name: "Nameless.DS-102"
  # Release version of this yaml file
  project_version: "v1.0.0"
  # Names of the two channels in Home Assistant
  ch1_name: "Light 1"
  ch2_name: "Light 2"

esphome:
  comment: "${device_description}"
  area: "${room}"
  project:
    name: "${project_name}"
    version: "${project_version}"
  on_boot:
    - priority: 600
      then:
        - select.set_index:
            id: power_mode1
            index: !lambda 'return id(restore_mode1)-1;'
        - select.set_index:
            id: power_mode2
            index: !lambda 'return id(restore_mode2)-1;'
        - lambda: |-
            if (id(restore_mode1) == 1) id(ch1).turn_off();
            if (id(restore_mode1) == 2) id(ch1).turn_on();
            if (id(restore_mode2) == 1) id(ch2).turn_off();
            if (id(restore_mode2) == 2) id(ch2).turn_on();

esp8266:
  board: esp01_1m
  # Keep saved settings (on/off states, Power On State) through a power cut
  restore_from_flash: true

globals:
  - id: restore_mode1
    type: int
    restore_value: yes
    initial_value: "3"
  - id: restore_mode2
    type: int
    restore_value: yes
    initial_value: "3"

select:
  - platform: template
    name: "${ch1_name} Power On State"
    id: power_mode1
    # Default: keep it as it was before power was lost
    initial_option: Restore Power Off State
    restore_value: true
    optimistic: true
    options:
      - Always Off
      - Always On
      - Restore Power Off State
    on_value:
      then:
        - lambda: 'id(restore_mode1) = i + 1;'
  - platform: template
    name: "${ch2_name} Power On State"
    id: power_mode2
    # Default: keep it as it was before power was lost
    initial_option: Restore Power Off State
    restore_value: true
    optimistic: true
    options:
      - Always Off
      - Always On
      - Restore Power Off State
    on_value:
      then:
        - lambda: 'id(restore_mode2) = i + 1;'

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO3
      inverted: True
    id: button1
    on_multi_click:
      - timing:
          - ON for at most 3s
          - OFF for at least 0.2s
        then:
          - light.toggle: ch1
      - timing:
          - ON for at least 8s
        then:
          - button.press: Reset
  - platform: gpio
    pin:
      number: GPIO5
      inverted: True
    id: button2
    on_multi_click:
      - timing:
          - ON for at most 3s
          - OFF for at least 0.2s
        then:
          - light.toggle: ch2
      - timing:
          - ON for at least 8s
        then:
          - button.press: Reset

switch:
  # Button LEDs (internal): on while their light is on
  - platform: gpio
    id: led1
    pin:
      number: GPIO14
      inverted: True
  - platform: gpio
    id: led2
    pin:
      number: GPIO1
      inverted: True

output:
  - platform: gpio
    pin: GPIO13
    id: relay1
  - platform: gpio
    pin: GPIO4
    id: relay2

status_led:
  pin:
    number: GPIO0
    inverted: True

light:
  - platform: binary
    id: ch1
    name: "${ch1_name}"
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - switch.turn_on: led1
    on_turn_off:
      - switch.turn_off: led1
    output: relay1
  - platform: binary
    id: ch2
    name: "${ch2_name}"
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - switch.turn_on: led2
    on_turn_off:
      - switch.turn_off: led2
    output: relay2

dashboard_import:
  package_import_url: github://avandeweghe/esphome_config/devices/nameless-ds-102.yaml@main
