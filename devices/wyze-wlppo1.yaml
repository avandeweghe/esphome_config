# Wyze Outdoor Plug WLPPO1 (ESP32, two outlets, HLW8012 power monitoring,
# light sensor). Outlet buttons: click toggles that outlet; hold outlet 1's
# button 8 s for a factory reset.
packages:
  base: !include ../common/base.yaml
  wifi: !include ../common/wifi.yaml
  esp32: !include ../common/esp32.yaml
  bt_proxy: !include ../common/bt-proxy.yaml
  improv: !include ../common/improv.yaml

substitutions:
  # Default name
  name: "wyze-outdoor-plug"
  # Default friendly name
  friendly_name: "Outdoor Plug"
  # Allows ESP device to be automatically linked to an 'Area' in Home Assistant
  room: ""
  # Description as appears in ESPHome & top of webserver page
  device_description: "Wyze Outdoor Plug WLPPO1 (ESP32, 2 outlets)"
  # Project Name
  project_name: "Wyze.WLPPO1"
  # Release version of this yaml file
  project_version: "v1.0.0"
  # HLW8012: higher value gives lower watt readout
  current_res: "0.001"
  # HLW8012: lower value gives lower voltage readout
  voltage_div: "770"

esphome:
  comment: "${device_description}"
  area: "${room}"
  project:
    name: "${project_name}"
    version: "${project_version}"
  on_boot:
    - priority: 600
      then:
        - select.set_index:
            id: power_mode1
            index: !lambda 'return id(restore_mode1)-1;'
        - select.set_index:
            id: power_mode2
            index: !lambda 'return id(restore_mode2)-1;'
        - lambda: |-
            if (id(restore_mode1) == 1) id(relay1).turn_off();
            if (id(restore_mode1) == 2) id(relay1).turn_on();
            if (id(restore_mode2) == 1) id(relay2).turn_off();
            if (id(restore_mode2) == 2) id(relay2).turn_on();

esp32:
  board: esp32dev
  framework:
    type: esp-idf

globals:
  - id: restore_mode1
    type: int
    restore_value: yes
    initial_value: "3"
  - id: restore_mode2
    type: int
    restore_value: yes
    initial_value: "3"

select:
  - platform: template
    name: "Outlet 1 Power On State"
    id: power_mode1
    # Default: keep the outlet as it was before power was lost
    initial_option: Restore Power Off State
    restore_value: true
    optimistic: true
    options:
      - Always Off
      - Always On
      - Restore Power Off State
    on_value:
      then:
        - lambda: 'id(restore_mode1) = i + 1;'
  - platform: template
    name: "Outlet 2 Power On State"
    id: power_mode2
    initial_option: Restore Power Off State
    restore_value: true
    optimistic: true
    options:
      - Always Off
      - Always On
      - Restore Power Off State
    on_value:
      then:
        - lambda: 'id(restore_mode2) = i + 1;'

switch:
  - platform: gpio
    name: "Outlet 1"
    pin:
      number: GPIO15
      inverted: false
    restore_mode: RESTORE_DEFAULT_OFF
    id: relay1
    icon: mdi:power-socket-us
    on_turn_on:
      - light.turn_on: relay1_led
    on_turn_off:
      - light.turn_off: relay1_led
  - platform: gpio
    name: "Outlet 2"
    pin:
      number: GPIO32
      inverted: false
    restore_mode: RESTORE_DEFAULT_OFF
    id: relay2
    icon: mdi:power-socket-us
    on_turn_on:
      - light.turn_on: relay2_led
    on_turn_off:
      - light.turn_off: relay2_led

output:
  - platform: gpio
    pin: GPIO19
    inverted: True
    id: relay1_led_gpio
  - platform: gpio
    pin: GPIO16
    inverted: True
    id: relay2_led_gpio

light:
  # Outlet indicator LEDs (follow the relays)
  - platform: binary
    name: Relay1 LED
    id: relay1_led
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    output: relay1_led_gpio
  - platform: binary
    name: Relay2 LED
    id: relay2_led
    internal: true
    output: relay2_led_gpio
    restore_mode: RESTORE_DEFAULT_OFF

sensor:
  - platform: adc
    pin: GPIO34
    name: LUX
    update_interval: 10s
    attenuation: 12db
  - platform: hlw8012
    sel_pin:
      number: GPIO25
      inverted: true
    cf_pin: GPIO27
    cf1_pin: GPIO26
    current_resistor: ${current_res}
    voltage_divider: ${voltage_div}
    change_mode_every: 3
    update_interval: 3s
    current:
      name: Amps
      unit_of_measurement: A
      accuracy_decimals: 2
    voltage:
      name: Volts
      unit_of_measurement: V
      accuracy_decimals: 1
    power:
      name: Watts
      unit_of_measurement: W
      accuracy_decimals: 0
      filters:
        - calibrate_linear:
            - 0.0 -> 0.0
            - 134 -> 58

binary_sensor:
  - platform: gpio
    internal: true
    pin:
      number: GPIO18
      mode: INPUT_PULLDOWN
      inverted: True
    name: Button1
    id: button1
    filters:
      - delayed_on_off: 20ms
    # Toggle the instant the button is released (press up to 1 s, no extra wait).
    on_click:
      min_length: 0ms
      max_length: 1s
      then:
        - switch.toggle: relay1
    on_multi_click:
      - timing:
          - ON for at least 8s
        then:
          - button.press: Reset
  - platform: gpio
    internal: true
    pin:
      number: GPIO17
      mode: INPUT_PULLDOWN
      inverted: True
    name: Button2
    id: button2
    on_press:
      - switch.toggle: relay2

status_led:
  pin:
    number: GPIO5
    inverted: true

dashboard_import:
  package_import_url: github://avandeweghe/esphome_config/devices/wyze-wlppo1.yaml@main
