# Athom SW01 1-gang touch wall switch (ESP8266, ESP8285 1MB)
# Same features as devices/athom-sw13.yaml: power-on state, button mode
# (Relay / Programmable with click events), status LED and button LED.
packages:
  base: !include ../common/base.yaml
  wifi: !include ../common/wifi.yaml

substitutions:
  # Default name
  name: "athom-sw01"
  # Default friendly name
  friendly_name: "SW01 Switch"
  # Allows ESP device to be automatically linked to an 'Area' in Home Assistant
  room: ""
  # Description as appears in ESPHome & top of webserver page
  device_description: "Athom SW01 1-gang touch switch"
  # Project Name
  project_name: "Athom.SW01"
  # Release version of this yaml file
  project_version: "v2.0.0"
  # Restore the relay upon reboot to state:
  light_restore_mode: RESTORE_DEFAULT_OFF
  # Name of the main light entity. "None" = just the device name (light.<device>)
  light_name: "None"

esphome:
  comment: "${device_description}"
  area: "${room}"
  project:
    name: "${project_name}"
    version: "${project_version}"
  on_boot:
    - priority: 600
      then:
        - select.set_index:
            id: power_mode
            index: !lambda |-
                    return id(restore_mode)-1;
        - lambda: |-
              switch(id(restore_mode))
              {
              case 1:{
                      id(light1).turn_off();
                      break;
                            }
              case 2:{
                      id(light1).turn_on();
                      break;
                            }
              default:{
                      break;
                            }
              }

esp8266:
  board: esp01_1m

globals:
  - id: restore_mode
    type: int
    restore_value: yes
    initial_value: "3"

select:
  - platform: template
    name: "Power On State"
    id: "power_mode"
    optimistic: true
    options:
      - Always Off
      - Always On
      - Restore Power Off State
    on_value:
      then:
        - lambda: |-
            id(restore_mode)=i+1;

  - platform: template
    name: "Button Mode"
    id: button_mode
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: Relay
    options:
      - Relay
      - Programmable

event:
  - platform: template
    name: "Button Event"
    id: button_event
    device_class: button
    event_types:
      - single_click
      - double_click
      - long_press

binary_sensor:
  #Button
  - platform: gpio
    pin:
      inverted: true
      number: GPIO3
      mode:
        input: true
        pullup: true
    name: "Button"
    id: button1
    disabled_by_default: true
    filters:
      - delayed_on_off: 20ms
    on_multi_click:
      # Keep the original local relay controls in Relay mode.
      - timing:
          - ON for at most 0.5s
          - OFF for at least 0.2s
        then:
          - if:
              condition:
                select.is:
                  id: button_mode
                  options: Relay
              then:
                - light.toggle: light1
      - timing:
          - ON for at least 4s
        then:
          - if:
              condition:
                select.is:
                  id: button_mode
                  options: Relay
              then:
                - button.press: Reset

      # In Programmable mode, the button reports events without toggling the relay.
      # Strictly below 1s / 300ms keeps the click and long-press windows separate.
      - timing:
          - ON for at most 999ms
          - OFF for at most 299ms
          - ON for at most 999ms
          - OFF for at least 300ms
        invalid_cooldown: 0s
        then:
          - if:
              condition:
                select.is:
                  id: button_mode
                  options: Programmable
              then:
                - event.trigger:
                    id: button_event
                    event_type: double_click
      - timing:
          - ON for at most 999ms
          - OFF for at least 300ms
        invalid_cooldown: 0s
        then:
          - if:
              condition:
                select.is:
                  id: button_mode
                  options: Programmable
              then:
                - event.trigger:
                    id: button_event
                    event_type: single_click
      - timing:
          - ON for at least 1s
        invalid_cooldown: 0s
        then:
          - if:
              condition:
                select.is:
                  id: button_mode
                  options: Programmable
              then:
                - event.trigger:
                    id: button_event
                    event_type: long_press
      # Keep a physical recovery gesture, with extra time for programmable holds.
      - timing:
          - ON for at least 10s
        invalid_cooldown: 0s
        then:
          - if:
              condition:
                select.is:
                  id: button_mode
                  options: Programmable
              then:
                - button.press: Reset

output:
  # Relay
  - platform: gpio
    pin: GPIO13
    id: relay1
  # Button LED (1.0 = Blue / 0.0 = Red)
  - platform: esp8266_pwm
    pin: GPIO14
    inverted: true
    id: button_led1

light:
  - platform: status_led
    name: "Status LED"
    id: red_led
    icon: mdi:lightbulb-outline
    disabled_by_default: true
    pin:
      inverted: true
      number: GPIO0
  # Relay
  - platform: binary
    name: ${light_name}
    id: light1
    output: relay1
    restore_mode: ${light_restore_mode}
    on_turn_on:
      - light.turn_on: led1
    on_turn_off:
      - light.turn_off: led1

  # Button LED
  - platform: monochromatic
    name: "LED"
    disabled_by_default: true
    id: led1
    output: button_led1
    default_transition_length: 500ms

dashboard_import:
  package_import_url: github://avandeweghe/esphome_config/devices/athom-sw01.yaml@main
