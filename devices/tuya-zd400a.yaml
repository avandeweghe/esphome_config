# Tuya ZD400A Wi-Fi vibration sensor (T1-U-HL module, BK7238, 2 x AAA),
# Bluetooth (BTHome) version. Same scheme as devices/tuya-xt-v2-bthome.yaml.
#
# Normal wake (vibration, button or 24 h heartbeat):
#   boot -> BLE stack -> BTHome broadcast (LED blinks) -> deep sleep.
#   A vibration wake sends "vibration on" for 1.5 s, then "vibration off" for
#   1.5 s, so Home Assistant sees a pulse. Wi-Fi stays OFF; there is no API.
#   Home Assistant gets the readings through the Bluetooth proxies (BTHome).
# Update mode: press the button to wake it and keep holding 3 s (works even if
#   Bluetooth fails), or hold it 5 s while it's awake (press it to wake, keep
#   holding). It reboots into a Wi-Fi-only boot (no Bluetooth), LED solid, OTA
#   for 5 min or until the button is pressed, then sleep. The first boot after
#   a new install is also an update-mode boot.
#
# BTHome data: vibration, battery %, button press, and "count" = ms
# from boot to first broadcast.
#
# Pins (stock Tuya firmware config + I2C pin scan):
#   P24 SDA / P9 SCL  MiraMEMS DA217 ("mir3da") accelerometer, I2C 0x26, id 0x13
#   P6   accelerometer INT1 (motion, active high, latched until cleared)
#   P16  button (active LOW)          P21  status LED (active HIGH)
#   P26  accelerometer INT2 (stock "tamper" input; unused, kept low)
#   P20  battery ADC (ADC3), P23 divider enable
#
# Each device file sets name, friendly_name and ble_name (the BTHome local name).
packages:
  base: !include ../common/base.yaml
  wifi: !include ../common/wifi.yaml

substitutions:
  # Default name
  name: "vibration-sensor"
  # Default friendly name
  friendly_name: "Vibration Sensor"
  # BTHome local name broadcast over Bluetooth (max 6 characters)
  ble_name: "Vibe"
  # Description as appears in ESPHome & top of webserver page
  device_description: "Tuya ZD400A vibration sensor (T1-U-HL, BK7238, BTHome)"
  # Project Name
  project_name: "Tuya.ZD400A"
  # Release version of this yaml file
  project_version: "v1.1.0"
  # Default motion threshold in 3.91 mg steps (±2 g range); 20 = 78 mg.
  # Can be changed in update mode with the "Vibration Threshold" number.
  vibration_threshold: "20"

esphome:
  comment: "${device_description}"
  project:
    name: "${project_name}"
    version: "${project_version}"
  platformio_options:
    # Turn Beken's Bluetooth stack back on (ESPHome sets this option to 0
    # itself, so ours must be a list to merge).
    custom_options.sys_config#h:
      - "CFG_SUPPORT_BLE = 1"
  on_boot:
    - priority: 200
      then:
        # Read the accelerometer's latched interrupt (did vibration wake us?),
        # (re)apply its settings and clear the latch.
        - script.execute:
            id: accel
            op: 0
        # Wi-Fi starts normally at boot (OTA needs the network stack: with Wi-Fi
        # off from boot, OTA's setup crashes the chip).
        # First boot after an install: stay in update mode (Wi-Fi on).
        - if:
            condition:
              lambda: |-
                // Build stamp differs from the one saved in flash = new firmware.
                uint32_t build = fnv1_hash(__DATE__ " " __TIME__);
                if (build == id(last_build)) return false;
                id(last_build) = build;
                return true;
            then:
              - globals.set: { id: in_update, value: "true" }
        # Update mode requested by a 5 s button hold (set, then rebooted).
        - if:
            condition:
              lambda: 'return id(update_req);'
            then:
              - globals.set: { id: update_req, value: "false" }
              - globals.set: { id: in_update, value: "true" }
        # Button held at boot (press to wake / power up, keep holding 3 s):
        # update mode straight away. Doesn't depend on Bluetooth working.
        - if:
            condition:
              lambda: 'return !id(in_update) && digitalRead(PIN_P16) == LOW;'
            then:
              - wait_until:
                  condition:
                    lambda: 'return digitalRead(PIN_P16) == HIGH;'
                  timeout: 3s
              - if:
                  condition:
                    lambda: 'return digitalRead(PIN_P16) == LOW;'
                  then:
                    - logger.log: "Button held at boot: update mode"
                    - globals.set: { id: in_update, value: "true" }
        # Update mode is a clean Wi-Fi-only boot: Bluetooth never starts.
        - if:
            condition:
              lambda: 'return id(in_update);'
            then:
              - script.execute: update_mode
            else:
              - wifi.disable:
    - priority: -100
      then:
        # Read the battery once per wake-up.
        - output.turn_on: bat_enable
        - delay: 100ms
        - component.update: battery_voltage
        - output.turn_off: bat_enable
        # Normal wake: start Bluetooth (from the main loop, not during setup).
        - if:
            condition:
              lambda: 'return !id(in_update);'
            then:
              - delay: 1ms
              - bthome_beken.start: ble
              - script.execute: ble_watchdog

bk72xx:
  board: t1-u
  framework:
    uart_port: 1

api:
  # The API only runs in update mode (Wi-Fi is off otherwise), so never reboot
  # for having no Home Assistant connection.
  reboot_timeout: 0s

# Overrides of common/base.yaml for a battery sensor.
preferences:
  flash_write_interval: 1min

# Logs on UART1 (TX1 = P11, pad 15), where a USB serial adapter can attach.
logger:
  hardware_uart: UART1
  baud_rate: 115200

wifi:
  fast_connect: true
  # Starts at boot (see on_boot), switched off straight away unless in update
  # mode. Never reboot for being offline.
  reboot_timeout: 0s

external_components:
  - source:
      type: git
      url: https://github.com/avandeweghe/esphome-bthome-beken
      ref: main
    refresh: 0s
    components: [bthome_beken]

button:
  - platform: template
    name: "Sleep Now"
    icon: mdi:sleep
    on_press:
      - logger.log: "Sleep now pressed in Home Assistant"
      - script.stop: update_mode
      - script.execute:
          id: sleep_now
          minutes: 1440

number:
  # Motion threshold (3.91 mg steps). Change it in update mode; it is saved
  # and applied to the accelerometer at every wake.
  - platform: template
    name: "Vibration Threshold"
    id: vib_threshold
    icon: mdi:vibrate
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${vibration_threshold}
    min_value: 1
    max_value: 255
    step: 1
    on_value:
      - script.execute:
          id: accel
          op: 2

output:
  - platform: gpio
    id: bat_enable
    pin: P23
  - platform: gpio
    id: led
    pin: P21

binary_sensor:
  # Reported vibration state (on for a vibration wake / motion while awake).
  - platform: template
    id: vibration
    name: "Vibration"
    device_class: vibration
  # Accelerometer INT1: goes high on motion and stays high until cleared.
  - platform: gpio
    id: accel_int
    internal: true
    pin:
      number: P6
      mode:
        input: true
        pulldown: true
      allow_other_uses: true
    on_press:
      - logger.log: "Motion while awake"
      - binary_sensor.template.publish:
          id: vibration
          state: ON
      - script.execute:
          id: accel
          op: 1
      # Give the new "on" its full window before the "off" + sleep.
      - if:
          condition:
            script.is_running: report_then_sleep
          then:
            - script.execute: report_then_sleep
      # Update mode (Wi-Fi, no report_then_sleep): turn it off after a quiet period.
      - if:
          condition:
            script.is_running: update_mode
          then:
            - script.execute: vibration_quiet
  - platform: gpio
    id: side_button
    internal: true
    pin:
      number: P16
      mode:
        input: true
        pullup: true
      # Active low: the pin idles high and the button pulls it to ground.
      inverted: true
      allow_other_uses: true
    on_press:
      - bthome_beken.button_event:
          type: press

sensor:
  - platform: adc
    id: battery_voltage
    name: "Battery Voltage"
    entity_category: diagnostic
    pin: ADC3
    # Average 16 readings per wake.
    samples: 16
    update_interval: never
    filters:
      # Raw ADC voltage (divider on) -> battery voltage, from a bench supply
      # checked with a meter (2026-11-26). The BK7238 ADC reads high with an
      # offset, so this is a straight-line fit, not a plain multiplier.
      - calibrate_linear:
          method: least_squares
          datapoints:
            - 3.529 -> 3.0
            - 3.361 -> 2.7
            - 3.249 -> 2.5
    on_value:
      - logger.log:
          format: "Battery %.3f V"
          args: [x]
      - component.update: battery_level
  - platform: template
    id: battery_level
    name: "Battery"
    unit_of_measurement: "%"
    device_class: battery
    update_interval: never
    lambda: |-
      float v = id(battery_voltage).state;
      if (isnan(v)) return {};
      // 2 x AAA alkaline discharge curve (light-load reading at boot).
      static const float V[] = {2.2f, 2.4f, 2.6f, 2.8f, 3.0f};
      static const float P[] = {0.0f, 20.0f, 45.0f, 75.0f, 100.0f};
      if (v <= V[0]) return 0.0f;
      if (v >= V[4]) return 100.0f;
      int i = 0;
      while (v > V[i + 1]) i++;
      return P[i] + (v - V[i]) / (V[i + 1] - V[i]) * (P[i + 1] - P[i]);
  # Update mode: peak vibration each second, in the same units as "Vibration
  # Threshold" (3.91 mg steps), to help pick a threshold. Sampled ~10x/s, so
  # it's a guide: the chip itself compares at 31 Hz.
  - platform: template
    id: vibration_level
    name: "Vibration Level"
    icon: mdi:sine-wave
    unit_of_measurement: "steps"
    accuracy_decimals: 0
    state_class: measurement
    update_interval: never

bthome_beken:
  id: ble
  auto_start: false
  local_name: "${ble_name}"
  # The BK7238 BLE stack adds the AD flags itself and rejects data with them.
  adv_flags: false
  vibration: vibration
  battery: battery_level
  adv_interval: 50ms
  on_packet:
    # Short blink for every packet sent (not in update mode, where it's solid).
    - if:
        condition:
          not:
            script.is_running: update_mode
        then:
          - output.turn_on: led
          - delay: 60ms
          - output.turn_off: led
  on_broadcast:
    - script.stop: ble_watchdog
    - lambda: |-
        id(last_ble) = millis();  // ms from boot to first broadcast (>0 = ok)
        global_preferences->sync();
    - script.execute: report_then_sleep

text_sensor:
  # Result of the last normal (Bluetooth) wake, shown in update mode.
  - platform: template
    id: last_ble_wake
    name: "Last BLE Wake"
    entity_category: diagnostic

interval:
  # Update mode: keep the LED solid (a packet blink can otherwise switch it off).
  - interval: 500ms
    then:
      - if:
          condition:
            script.is_running: update_mode
          then:
            - output.turn_on: led
  # Update mode: sample the accelerometer for the "Vibration Level" sensor.
  - interval: 100ms
    then:
      - if:
          condition:
            script.is_running: update_mode
          then:
            - script.execute:
                id: accel
                op: 3
  - interval: 1s
    then:
      - if:
          condition:
            script.is_running: update_mode
          then:
            - lambda: |-
                id(vibration_level).publish_state(id(vib_peak));
                id(vib_peak) = 0;

globals:
  - id: vib_peak
    type: float
    restore_value: false
    initial_value: '0'
  # Last Bluetooth wake: >0 = ms to first broadcast, <0 = failed (-1 = BLE
  # started but never broadcast, -2 = BLE stack never started), 0 = none yet.
  - id: last_ble
    type: int
    restore_value: true
    initial_value: '0'
  - id: update_req
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: in_update
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: last_build
    type: uint32_t
    restore_value: true
    initial_value: '0'

script:
  # DA217 accelerometer over bit-banged I2C (SDA P24, SCL P9, address 0x26).
  # Register values from the MiraMEMS DA217 datasheet (Rev 0.2).
  # op 0: boot - note whether its latched motion interrupt woke us, apply the
  #       settings, clear the latch.  op 1: clear the latch.  op 2: threshold.
  - id: accel
    mode: queued
    parameters:
      op: int
    then:
      - lambda: |-
          const uint32_t SDA = PIN_P24, SCL = PIN_P9;
          const uint8_t ADDR = 0x26;
          const int D = 5;
          auto H = [](uint32_t p) { pinMode(p, INPUT_PULLUP); };
          auto L = [](uint32_t p) { pinMode(p, OUTPUT); digitalWrite(p, LOW); };
          auto start = [&]() {
            H(SDA); delayMicroseconds(D); H(SCL); delayMicroseconds(D);
            L(SDA); delayMicroseconds(D); L(SCL); delayMicroseconds(D);
          };
          auto stop = [&]() {
            L(SDA); delayMicroseconds(D); H(SCL); delayMicroseconds(D);
            H(SDA); delayMicroseconds(D);
          };
          auto wbyte = [&](uint8_t v) -> bool {
            for (int i = 7; i >= 0; i--) {
              if (v & (1 << i)) H(SDA); else L(SDA);
              delayMicroseconds(D); H(SCL); delayMicroseconds(D); L(SCL);
            }
            H(SDA); delayMicroseconds(D); H(SCL); delayMicroseconds(D);
            bool ack = digitalRead(SDA) == LOW;
            L(SCL); delayMicroseconds(D);
            return ack;
          };
          auto rbyte = [&]() -> uint8_t {
            uint8_t v = 0;
            H(SDA);
            for (int i = 0; i < 8; i++) {
              delayMicroseconds(D); H(SCL); delayMicroseconds(D);
              v = (v << 1) | (digitalRead(SDA) ? 1 : 0);
              L(SCL);
            }
            H(SDA); delayMicroseconds(D); H(SCL); delayMicroseconds(D); L(SCL);  // NACK
            return v;
          };
          auto wr = [&](uint8_t reg, uint8_t val) -> bool {
            start();
            bool ok = wbyte(ADDR << 1) && wbyte(reg) && wbyte(val);
            stop();
            return ok;
          };
          auto rd = [&](uint8_t reg) -> int {
            start();
            if (!wbyte(ADDR << 1) || !wbyte(reg)) { stop(); return -1; }
            start();
            if (!wbyte((ADDR << 1) | 1)) { stop(); return -1; }
            uint8_t v = rbyte();
            stop();
            return v;
          };
          float t = id(vib_threshold).state;
          // Early in boot the saved number may not be restored yet (reads 0).
          uint8_t ths = (isnan(t) || t < 1.0f) ? ${vibration_threshold} : (uint8_t) clamp(t, 1.0f, 255.0f);

          if (op == 0) {
            bool pin_high = digitalRead(PIN_P6) == HIGH;
            int flag = rd(0x09);   // MOTION_FLAG, bit 2 = active (motion) interrupt
            int chip = rd(0x01);   // chip id, 0x13
            bool ok = wr(0x0F, 0x00)   // ±2 g, 14 bit
                   && wr(0x10, 0x05)   // 31.25 Hz, X/Y/Z on
                   && wr(0x11, 0x05)   // normal mode, 100 Hz BW, 12.5 Hz auto-sleep when still
                   && wr(0x27, 0x01)   // motion must last 2 samples
                   && wr(0x28, ths)    // motion threshold
                   && wr(0x21, 0x07)   // INT1 latched until cleared
                   && wr(0x19, 0x04)   // motion interrupt -> INT1
                   && wr(0x16, 0x07)   // motion interrupt on X/Y/Z
                   // INT1 + INT2 push-pull ACTIVE HIGH (bits 0 and 2) + clear the latch.
                   // On this chip a 0 bit means active LOW (the datasheet table says the
                   // opposite): P6 stayed low with motion latched until bit 0 was set.
                   && wr(0x20, 0x85);
            bool vib = pin_high || (flag >= 0 && (flag & 0x04));
            ESP_LOGI("accel", "chip 0x%02X, setup %s, wake pin %d, flag 0x%02X -> vibration %s, threshold %u",
                     chip, ok ? "ok" : "FAILED", pin_high, flag, vib ? "YES" : "no", ths);
            id(vibration).publish_state(vib);
          } else if (op == 1) {
            wr(0x20, 0x85);  // clear the latched interrupt (P6 goes low again), keep active high
          } else if (op == 2) {
            ESP_LOGI("accel", "threshold %u (%.0f mg)", ths, ths * 3.91f);
            wr(0x28, ths);
          } else if (op == 3) {
            // Vibration level sample: largest change on any axis since the
            // previous sample, in threshold steps (3.91 mg at ±2 g).
            static int16_t prev[3];
            static bool have_prev = false;
            int16_t cur[3];
            for (int a = 0; a < 3; a++) {
              int lo = rd(0x02 + 2 * a), hi = rd(0x03 + 2 * a);
              if (lo < 0 || hi < 0) return;
              cur[a] = ((int16_t) ((hi << 8) | lo)) >> 2;  // 14 bit, 4096 LSB/g
            }
            if (have_prev) {
              float d = 0;
              for (int a = 0; a < 3; a++) d = std::max(d, (float) abs(cur[a] - prev[a]));
              float steps = d * (1000.0f / 4096.0f) / 3.91f;  // LSB -> mg -> threshold steps
              if (steps > id(vib_peak)) id(vib_peak) = steps;
            }
            for (int a = 0; a < 3; a++) prev[a] = cur[a];
            have_prev = true;
          }

  # Update mode: "Vibration" off after 5 s without motion. If the chip has
  # latched motion again (P6 still high, so no new edge), clear it and wait again.
  - id: vibration_quiet
    mode: restart
    then:
      - delay: 5s
      - if:
          condition:
            binary_sensor.is_on: accel_int
          then:
            - script.execute:
                id: accel
                op: 1
            - script.execute: vibration_quiet
          else:
            - binary_sensor.template.publish:
                id: vibration
                state: OFF

  - id: report_then_sleep
    mode: restart
    then:
      - delay: 1500ms
      # Held button: if it's still down 5 s later, go to update mode instead.
      - if:
          condition:
            binary_sensor.is_on: side_button
          then:
            - wait_until:
                condition:
                  binary_sensor.is_off: side_button
                timeout: 5s
            - if:
                condition:
                  binary_sensor.is_on: side_button
                then:
                  # Reboot into a Wi-Fi-only update boot.
                  - logger.log: "Button held: rebooting into update mode"
                  - lambda: |-
                      id(update_req) = true;
                      global_preferences->sync();
                      App.safe_reboot();
      # Vibration pulse: send "off" and give it its own window before sleeping.
      - if:
          condition:
            binary_sensor.is_on: vibration
          then:
            - binary_sensor.template.publish:
                id: vibration
                state: OFF
            - delay: 1500ms
      - if:
          condition:
            script.is_running: update_mode
          then:
            - logger.log: "Update mode, staying awake"
          else:
            # Next wake: vibration, button, or the daily heartbeat.
            - script.execute:
                id: sleep_now
                minutes: 1440

  # Bluetooth didn't start broadcasting within 8 s of a wake: don't hang awake
  # with Wi-Fi off; note the failure and reboot into Wi-Fi update mode.
  - id: ble_watchdog
    mode: single
    then:
      - delay: 8s
      - lambda: |-
          ESP_LOGW("ble", "No BTHome broadcast 8 s after wake (stack started: %s), going to update mode",
                   id(ble).is_started() ? "yes" : "no");
          id(last_ble) = id(ble).is_started() ? -1 : -2;
          id(update_req) = true;
          global_preferences->sync();
          App.safe_reboot();

  - id: update_mode
    mode: single
    then:
      - lambda: |-
          int v = id(last_ble);
          char s[64];
          if (v > 0) snprintf(s, sizeof(s), "ok, broadcast %d ms after boot", v);
          else if (v == -1) snprintf(s, sizeof(s), "FAILED: BLE started, no broadcast in 8 s");
          else if (v == -2) snprintf(s, sizeof(s), "FAILED: BLE stack never started");
          else snprintf(s, sizeof(s), "no Bluetooth wake yet");
          id(last_ble_wake).publish_state(s);
      # A vibration wake sets "Vibration" on at boot; let it time out here too.
      - if:
          condition:
            binary_sensor.is_on: vibration
          then:
            - script.execute: vibration_quiet
      - logger.log: "Update mode: Wi-Fi on for 5 min (press the button to end it)"
      - output.turn_on: led
      - wifi.enable:
      # Let go of the hold that started it, then one press ends it early.
      - wait_until:
          condition:
            binary_sensor.is_off: side_button
          timeout: 8s
      - wait_until:
          condition:
            binary_sensor.is_on: side_button
          timeout: 5min
      - logger.log: "Update mode over"
      - script.execute:
          id: sleep_now
          minutes: 1440

  - id: sleep_now
    mode: single
    parameters:
      minutes: int
    then:
      - output.turn_off: led
      # Clear the motion latch so the next motion raises P6 and wakes us.
      - script.execute:
          id: accel
          op: 1
      - deep_sleep.enter:
          id: sleep_ctl
          sleep_duration: !lambda 'return (uint32_t) minutes * 60000;'

deep_sleep:
  id: sleep_ctl
  sleep_duration: 24h
  wakeup_pin:
    # Accelerometer INT1: wakes when motion latches it high.
    - pin:
        number: P6
        mode:
          input: true
          pulldown: true
        allow_other_uses: true
    # Button: wakes when pressed (pulls the pin low).
    - pin:
        number: P16
        mode:
          input: true
          pullup: true
        inverted: true
        allow_other_uses: true

dashboard_import:
  package_import_url: github://avandeweghe/esphome_config/devices/tuya-zd400a.yaml@main
