# Tuya ZD400A Wi-Fi vibration sensor (T1-U-HL module, BK7238, 2 x AAA).
# Wi-Fi only, always awake (no deep sleep, no Bluetooth): everything is
# reported to Home Assistant over the ESPHome API. Simple to set up and
# calibrate, but AAA batteries won't last long like this; use a 3 V supply
# or add deep sleep later.
#
# Vibration: the accelerometer latches its motion interrupt on P6; each time
# it fires, "Vibration" turns on, the latch is cleared, and "Vibration" turns
# off again after ${vibration_off_delay} without more motion.
#
# Pins (stock Tuya firmware config + I2C pin scan):
#   P24 SDA / P9 SCL  MiraMEMS DA217 ("mir3da") accelerometer, I2C 0x26, id 0x13
#   P6   accelerometer INT1 (motion, active high, latched until cleared)
#   P16  button (active LOW)          P21  status LED (active HIGH)
#   P26  tamper (active high)         P20  battery ADC (ADC3), P23 divider enable
packages:
  base: !include ../common/base.yaml
  wifi: !include ../common/wifi.yaml

substitutions:
  # Default name
  name: "vibration-sensor"
  # Default friendly name
  friendly_name: "Vibration Sensor"
  # Description as appears in ESPHome & top of webserver page
  device_description: "Tuya ZD400A vibration sensor (T1-U-HL, BK7238)"
  # Project Name
  project_name: "Tuya.ZD400A"
  # Release version of this yaml file
  project_version: "v2.0.0"
  # Default motion threshold in 3.91 mg steps (±2 g range); 20 = 78 mg.
  # Can be changed with the "Vibration Threshold" number.
  vibration_threshold: "20"
  # How long "Vibration" stays on after the last motion
  vibration_off_delay: "5s"
  # Battery: 2 x AAA empty/full voltages from the stock Tuya firmware
  # (min_V/max_V). The ADC calibration is in the battery_voltage filter.
  battery_empty: "2.704"
  battery_full: "3.106"

esphome:
  comment: "${device_description}"
  project:
    name: "${project_name}"
    version: "${project_version}"
  on_boot:
    # After all components are set up, so the saved "Vibration Threshold"
    # has been restored (at 200 it still read 0 and the chip got threshold 1).
    - priority: -100
      then:
        # Apply the accelerometer settings and clear any latched interrupt.
        - script.execute:
            id: accel
            op: 0

bk72xx:
  board: t1-u
  framework:
    uart_port: 1

# Logs on UART1 (TX1 = P11, pad 15), where a USB serial adapter can attach.
logger:
  hardware_uart: UART1
  baud_rate: 115200

number:
  # Motion threshold (3.91 mg steps); saved and re-applied at boot.
  - platform: template
    name: "Vibration Threshold"
    id: vib_threshold
    icon: mdi:vibrate
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${vibration_threshold}
    min_value: 1
    max_value: 255
    step: 1
    on_value:
      - script.execute:
          id: accel
          op: 2

output:
  - platform: gpio
    id: bat_enable
    pin: P23

light:
  # Status LED: blinks while Wi-Fi / Home Assistant aren't connected.
  - platform: status_led
    name: "Status LED"
    id: status_led_light
    disabled_by_default: true
    pin: P21

binary_sensor:
  - platform: template
    id: vibration
    name: "Vibration"
    device_class: vibration
  # Accelerometer INT1: goes high on motion and stays high until cleared.
  - platform: gpio
    id: accel_int
    # DEBUG (temporary): visible so the raw P6 level shows in Home Assistant.
    name: "Accel INT (P6)"
    entity_category: diagnostic
    pin:
      number: P6
      mode:
        input: true
        pulldown: true
    on_press:
      - script.execute: vibration_pulse
  - platform: gpio
    id: tamper
    name: "Tamper"
    device_class: tamper
    pin:
      number: P26
      mode:
        input: true
        pulldown: true
  - platform: gpio
    id: side_button
    name: "Button"
    pin:
      number: P16
      mode:
        input: true
        pullup: true
      # Active low: the pin idles high and the button pulls it to ground.
      inverted: true
    filters:
      - delayed_on_off: 20ms

sensor:
  - platform: adc
    id: battery_voltage
    name: "Battery Voltage"
    entity_category: diagnostic
    pin: ADC3
    # Average 16 readings per sample.
    samples: 16
    # Read by the interval below (the divider has to be switched on first).
    update_interval: never
    filters:
      # Raw ADC voltage (divider on) -> battery voltage, from a bench supply
      # checked with a meter (2026-11-26). The BK7238 ADC reads high with an
      # offset, so this is a straight-line fit, not a plain multiplier.
      - calibrate_linear:
          method: least_squares
          datapoints:
            - 3.529 -> 3.0
            - 3.361 -> 2.7
            - 3.249 -> 2.5
    on_value:
      - component.update: battery_level
  - platform: template
    id: battery_level
    name: "Battery"
    unit_of_measurement: "%"
    device_class: battery
    update_interval: never
    lambda: |-
      float v = id(battery_voltage).state;
      if (isnan(v)) return {};
      return clamp((v - ${battery_empty}f) / (${battery_full}f - ${battery_empty}f) * 100.0f, 0.0f, 100.0f);
  # Calibration aids: unscaled ADC voltage at P20 with the divider (P23)
  # switched on and off.
  - platform: template
    id: bat_adc_on
    name: "Battery ADC Raw"
    unit_of_measurement: "V"
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: bat_adc_off
    name: "Battery ADC Raw (Divider Off)"
    unit_of_measurement: "V"
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: never

text_sensor:
  - platform: template
    id: accel_setup
    name: "Accel Setup"
    entity_category: diagnostic
  # DEBUG (temporary): accelerometer registers, X/Y/Z and pin levels every 2 s.
  - platform: template
    id: accel_debug
    name: "Accel Debug"
    entity_category: diagnostic

interval:
  # DEBUG (temporary)
  - interval: 2s
    then:
      - script.execute:
          id: accel
          op: 3
  # Battery reading every 10 s: switch the divider on, sample, switch it off.
  - interval: 10s
    then:
      - output.turn_on: bat_enable
      - delay: 50ms
      - lambda: |-
          float v = id(battery_voltage).sample();
          id(bat_adc_on).publish_state(v);
          id(battery_voltage).publish_state(v);  // goes through the multiply filter
      - output.turn_off: bat_enable
      - delay: 50ms
      - lambda: |-
          float v = id(battery_voltage).sample();
          id(bat_adc_off).publish_state(v);
          ESP_LOGI("battery", "ADC raw: divider on %.3f V, off %.3f V -> %.3f V",
                   id(bat_adc_on).state, v, id(battery_voltage).state);

script:
  # Motion: report it, clear the accelerometer latch (so the next motion
  # fires again), and turn "Vibration" off after a quiet period.
  - id: vibration_pulse
    mode: restart
    then:
      - binary_sensor.template.publish:
          id: vibration
          state: ON
      - script.execute:
          id: accel
          op: 1
      - delay: ${vibration_off_delay}
      # Still latched (motion continued during the window): start again.
      - if:
          condition:
            binary_sensor.is_on: accel_int
          then:
            - script.execute: vibration_pulse
      - binary_sensor.template.publish:
          id: vibration
          state: OFF

  # DA217 accelerometer over bit-banged I2C (SDA P24, SCL P9, address 0x26).
  # Register values from the MiraMEMS DA217 datasheet (Rev 0.2).
  # op 0: boot - apply the settings and clear the latch.
  # op 1: clear the latch.  op 2: apply the threshold.
  - id: accel
    mode: queued
    parameters:
      op: int
    then:
      - lambda: |-
          const uint32_t SDA = PIN_P24, SCL = PIN_P9;
          const uint8_t ADDR = 0x26;
          const int D = 5;
          auto H = [](uint32_t p) { pinMode(p, INPUT_PULLUP); };
          auto L = [](uint32_t p) { pinMode(p, OUTPUT); digitalWrite(p, LOW); };
          auto start = [&]() {
            H(SDA); delayMicroseconds(D); H(SCL); delayMicroseconds(D);
            L(SDA); delayMicroseconds(D); L(SCL); delayMicroseconds(D);
          };
          auto stop = [&]() {
            L(SDA); delayMicroseconds(D); H(SCL); delayMicroseconds(D);
            H(SDA); delayMicroseconds(D);
          };
          auto wbyte = [&](uint8_t v) -> bool {
            for (int i = 7; i >= 0; i--) {
              if (v & (1 << i)) H(SDA); else L(SDA);
              delayMicroseconds(D); H(SCL); delayMicroseconds(D); L(SCL);
            }
            H(SDA); delayMicroseconds(D); H(SCL); delayMicroseconds(D);
            bool ack = digitalRead(SDA) == LOW;
            L(SCL); delayMicroseconds(D);
            return ack;
          };
          auto rbyte = [&]() -> uint8_t {
            uint8_t v = 0;
            H(SDA);
            for (int i = 0; i < 8; i++) {
              delayMicroseconds(D); H(SCL); delayMicroseconds(D);
              v = (v << 1) | (digitalRead(SDA) ? 1 : 0);
              L(SCL);
            }
            H(SDA); delayMicroseconds(D); H(SCL); delayMicroseconds(D); L(SCL);  // NACK
            return v;
          };
          auto wr = [&](uint8_t reg, uint8_t val) -> bool {
            start();
            bool ok = wbyte(ADDR << 1) && wbyte(reg) && wbyte(val);
            stop();
            return ok;
          };
          auto rd = [&](uint8_t reg) -> int {
            start();
            if (!wbyte(ADDR << 1) || !wbyte(reg)) { stop(); return -1; }
            start();
            if (!wbyte((ADDR << 1) | 1)) { stop(); return -1; }
            uint8_t v = rbyte();
            stop();
            return v;
          };
          float t = id(vib_threshold).state;
          uint8_t ths = isnan(t) ? ${vibration_threshold} : (uint8_t) clamp(t, 1.0f, 255.0f);

          if (op == 0) {
            int chip = rd(0x01);   // chip id, 0x13
            bool ok = wr(0x0F, 0x00)   // ±2 g, 14 bit
                   && wr(0x10, 0x05)   // 31.25 Hz, X/Y/Z on
                   && wr(0x11, 0x05)   // normal mode, 100 Hz BW, 12.5 Hz auto-sleep when still
                   && wr(0x27, 0x01)   // motion must last 2 samples
                   && wr(0x28, ths)    // motion threshold
                   && wr(0x21, 0x07)   // INT1 latched until cleared
                   && wr(0x19, 0x04)   // motion interrupt -> INT1
                   && wr(0x16, 0x07)   // motion interrupt on X/Y/Z
                   // INT1 push-pull, ACTIVE HIGH (bit 0 = 1) + clear the latch (bit 7).
                   // The datasheet table says 0 = high, but on this chip 0 = active LOW
                   // (measured: P6 stayed low with the motion flag latched).
                   && wr(0x20, 0x81);
            // P26 ("tamper" in the stock firmware) goes to the accelerometer:
            // check whether it follows the INT2 level bit (0x20 bit 2).
            int p26_lvl0 = digitalRead(PIN_P26);
            wr(0x20, 0x05);  // INT1 + INT2 active high
            delayMicroseconds(50);
            int p26_lvl1 = digitalRead(PIN_P26);
            ESP_LOGI("accel", "chip 0x%02X, setup %s, threshold %u (%.0f mg), P26 INT2_LVL 0->%d 1->%d",
                     chip, ok ? "ok" : "FAILED", ths, ths * 3.91f, p26_lvl0, p26_lvl1);
            char s[64];
            snprintf(s, sizeof(s), "chip 0x%02X, setup %s, P26 lvl0=%d lvl1=%d", chip < 0 ? 0 : chip,
                     ok ? "ok" : "FAILED", p26_lvl0, p26_lvl1);
            id(accel_setup).publish_state(s);
          } else if (op == 1) {
            wr(0x20, 0x85);  // clear the latched interrupt (P6 goes low again), keep INT1/INT2 active high
          } else if (op == 2) {
            ESP_LOGI("accel", "threshold %u (%.0f mg)", ths, ths * 3.91f);
            wr(0x28, ths);
          } else if (op == 3) {
            // DEBUG: registers, live acceleration and pin levels.
            int r[0x29];
            for (int i = 0; i < 0x29; i++) r[i] = -1;
            const uint8_t regs[] = {0x01, 0x02, 0x03, 0x04, 0x05, 0x06, 0x07, 0x09, 0x0B,
                                    0x0F, 0x10, 0x11, 0x16, 0x19, 0x20, 0x21, 0x27, 0x28};
            for (uint8_t reg : regs) r[reg] = rd(reg);
            auto axis = [&](int lo, int hi) -> float {
              if (lo < 0 || hi < 0) return NAN;
              int16_t v = (int16_t) ((hi << 8) | lo);
              return (v >> 2) / 4096.0f;  // 14 bit, ±2 g
            };
            float x = axis(r[0x02], r[0x03]), y = axis(r[0x04], r[0x05]), z = axis(r[0x06], r[0x07]);
            int p6 = digitalRead(PIN_P6);
            int p26_pd = digitalRead(PIN_P26);
            pinMode(PIN_P26, INPUT_PULLUP);
            delayMicroseconds(50);
            int p26_pu = digitalRead(PIN_P26);
            pinMode(PIN_P26, INPUT_PULLDOWN);
            char s[255];
            snprintf(s, sizeof(s),
                     "id=%02X x=%.2f y=%.2f z=%.2f flag=%02X act=%02X | 0F=%02X 10=%02X 11=%02X "
                     "16=%02X 19=%02X 20=%02X 21=%02X 27=%02X 28=%02X | P6=%d P26 pd=%d pu=%d",
                     r[0x01] & 0xFF, x, y, z, r[0x09] & 0xFF, r[0x0B] & 0xFF, r[0x0F] & 0xFF, r[0x10] & 0xFF,
                     r[0x11] & 0xFF, r[0x16] & 0xFF, r[0x19] & 0xFF, r[0x20] & 0xFF, r[0x21] & 0xFF,
                     r[0x27] & 0xFF, r[0x28] & 0xFF, p6, p26_pd, p26_pu);
            ESP_LOGD("accel", "%s", s);
            id(accel_debug).publish_state(s);
          }

dashboard_import:
  package_import_url: github://avandeweghe/esphome_config/devices/tuya-zd400a.yaml@main
