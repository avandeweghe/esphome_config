# Athom SW13 1-gang wall switch (ESP32-C3)
# Based on athom-tech/esp32-configs athom-1gang-switch.yaml (v3.0.7)
# https://github.com/athom-tech/esp32-configs
packages:
  base: !include ../common/base.yaml
  esp32: !include ../common/esp32.yaml
  bt_proxy: !include ../common/bt-proxy.yaml

substitutions:
  # Default name
  name: "athom-1gang-switch"
  # Default friendly name
  friendly_name: "1Gang Switch"
  # Allows ESP device to be automatically linked to an 'Area' in Home Assistant. Typically used for areas such as 'Lounge Room', 'Kitchen' etc
  room: ""
  # Description as appears in ESPHome & top of webserver page
  device_description: "athom esp32-c3 1gang switch"
  # Project Name
  project_name: "IoTorero.SW13"
  # Projection version denotes the release version of the yaml file, allowing checking of deployed vs latest version
  project_version: "v3.0.7"
  # Restore the relay (GPO switch) upon reboot to state:
  light_restore_mode: RESTORE_DEFAULT_OFF

esphome:
  comment: "${device_description}"
  area: "${room}"
  name_add_mac_suffix: true
  project:
    name: "${project_name}"
    version: "${project_version}"
  on_boot:
    - priority: 600
      then:
        - select.set_index:
            id: power_mode
            index: !lambda |-
                    return id(restore_mode)-1;
        - lambda: |-
              switch(id(restore_mode))
              {
              case 1:{
                      id(light1).turn_off();
                      break;
                            }
              case 2:{
                      id(light1).turn_on();
                      break;
                            }
              default:{
                      break;
                            }
              }

esp32:
  board: esp32-c3-devkitm-1
  flash_size: 4MB
  flash_mode: dio
  variant: ESP32C3
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      # @grigi found in testing that these options resulted in better responsiveness.
      # BLE 4.2 is supported by ALL ESP32 boards that have bluetooth, the original and derivatives.
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: y
      # Also enable this on any derivative boards (S2, C3 etc) but not the original ESP32.
      CONFIG_BT_BLE_50_FEATURES_SUPPORTED: y
      # Extend the watchdog timeout, so the device reboots if the device appears locked up for over 10 seconds.
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "10"

dashboard_import:
  package_import_url: github://avandeweghe/esphome_config/devices/athom-sw13.yaml@main

globals:
  - id: restore_mode
    type: int
    restore_value: yes
    initial_value: "3"

select:
  - platform: template
    name: "Power On State"
    id: "power_mode"
    optimistic: true
    options:
      - Always Off
      - Always On
      - Restore Power Off State
    on_value:
      then:
        - lambda: |-
            id(restore_mode)=i+1;

  - platform: template
    name: "Button Mode"
    id: button_mode
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: Relay
    options:
      - Relay
      - Programmable

event:
  - platform: template
    name: "Button Event"
    id: button_event
    device_class: button
    event_types:
      - single_click
      - double_click
      - long_press

binary_sensor:
  #Button
  - platform: gpio
    pin:
      inverted: true
      number: GPIO20
      mode:
        input: true
        pullup: true
    name: "Button"
    id: button1
    disabled_by_default: true
    filters:
      - delayed_on_off: 20ms
    on_multi_click:
      # Keep the original local relay controls in Relay mode.
      - timing:
          - ON for at most 0.5s
          - OFF for at least 0.2s
        then:
          - if:
              condition:
                select.is:
                  id: button_mode
                  options: Relay
              then:
                - light.toggle: light1
      - timing:
          - ON for at least 4s
        then:
          - if:
              condition:
                select.is:
                  id: button_mode
                  options: Relay
              then:
                - button.press: Reset

      # In Programmable mode, the button reports events without toggling the relay.
      # Strictly below 1s / 300ms keeps the click and long-press windows separate.
      - timing:
          - ON for at most 999ms
          - OFF for at most 299ms
          - ON for at most 999ms
          - OFF for at least 300ms
        invalid_cooldown: 0s
        then:
          - if:
              condition:
                select.is:
                  id: button_mode
                  options: Programmable
              then:
                - event.trigger:
                    id: button_event
                    event_type: double_click
      - timing:
          - ON for at most 999ms
          - OFF for at least 300ms
        invalid_cooldown: 0s
        then:
          - if:
              condition:
                select.is:
                  id: button_mode
                  options: Programmable
              then:
                - event.trigger:
                    id: button_event
                    event_type: single_click
      - timing:
          - ON for at least 1s
        invalid_cooldown: 0s
        then:
          - if:
              condition:
                select.is:
                  id: button_mode
                  options: Programmable
              then:
                - event.trigger:
                    id: button_event
                    event_type: long_press
      # Keep a physical recovery gesture, with extra time for programmable holds.
      - timing:
          - ON for at least 10s
        invalid_cooldown: 0s
        then:
          - if:
              condition:
                select.is:
                  id: button_mode
                  options: Programmable
              then:
                - button.press: Reset

output:
  # Relay
  - platform: gpio
    pin: GPIO5
    id: relay1
  # Button LED
  - platform: ledc
    pin: GPIO3
    inverted: true
    id: button_led1

light:
  - platform: status_led
    name: "Status LED"
    id: red_led
    icon: mdi:lightbulb-outline
    disabled_by_default: true
    pin:
      inverted: true
      number: GPIO9
  # Relay
  - platform: binary
    name: "Light"
    id: light1
    output: relay1
    restore_mode: ${light_restore_mode}
    on_turn_on:
      - light.turn_on: led1
    on_turn_off:
      - light.turn_off: led1

  # Button LED
  - platform: monochromatic
    name: "LED"
    disabled_by_default: true
    id: led1
    output: button_led1
    default_transition_length: 500ms
