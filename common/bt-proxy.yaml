# Bluetooth proxy with an on/off switch (ESP32 with Bluetooth only).
# Off by default (set bt_proxy_restore_mode to change); the switch state survives reboots.
# When the switch is on, Bluetooth starts and scans continuously, like a stock ESPHome proxy.
# Include with:  bt_proxy: !include ../common/bt-proxy.yaml
substitutions:
  # RESTORE_DEFAULT_OFF or RESTORE_DEFAULT_ON (dedicated proxies)
  bt_proxy_restore_mode: RESTORE_DEFAULT_OFF
  # true hides the Bluetooth Proxy switch in Home Assistant (dedicated proxies)
  bt_proxy_switch_disabled: "false"

esp32_ble:
  id: esp32_ble_component
  # Off until the Bluetooth Proxy switch turns it on
  enable_on_boot: false

esp32_ble_tracker:
  id: esp32_ble_tracker_component
  scan_parameters:
    # Scan whenever Bluetooth is enabled. Starting scans only on api connect
    # raced with the switch's restore at boot and left the proxy silent.
    continuous: true
    active: true  # send scan-request packets to gather more info, like device name for some devices.
    interval: 320ms  # default 320ms - how long to spend on each advert channel
    window:   300ms  # default 30ms - how long to actually "listen" in each interval. Reduce this if device is unstable.

bluetooth_proxy:
  id: bluetooth_proxy_component
  active: true

switch:
  - platform: template
    name: "Bluetooth Proxy"
    id: bluetooth_proxy_switch
    disabled_by_default: ${bt_proxy_switch_disabled}
    icon: mdi:bluetooth
    entity_category: config
    optimistic: true
    restore_mode: ${bt_proxy_restore_mode}
    turn_on_action:
      - ble.enable:
    turn_off_action:
      - ble.disable:
