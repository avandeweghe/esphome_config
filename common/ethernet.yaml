# Wired Ethernet network and diagnostics.
# The device file adds the PHY type and pins under ethernet:.
# Include with:  ethernet: !include ../common/ethernet.yaml
ethernet:
  id: ethernet_component
  # Define dns domain / suffix to add to hostname
  domain: "${dns_domain}"

text_sensor:
  - platform: ethernet_info
    ip_address:
      name: "IP Address"
      id: ip_address
      icon: mdi:ip-network
      entity_category: diagnostic
    mac_address:
      name: "Mac Address"
      id: mac_address
      icon: mdi:network-pos
      entity_category: diagnostic
