# Common to every device (ESP8266, ESP32, BK72xx, RP2040).
# Device packages include this with:  base: !include ../common/base.yaml
substitutions:
  # Default name (override in the device file)
  name: "esphome-device"
  # Default friendly name
  friendly_name: "ESPHome Device"
  # DNS domain added to the hostname (secrets.yaml, e.g. ".iot.example.com")
  dns_domain: !secret dns_domain
  # Enables faster network connections, with last connected SSID being connected to and no full scan for SSID being undertaken
  wifi_fast_connect: "false"
  # Define logging level: NONE, ERROR, WARN, INFO, DEBUG (Default), VERBOSE, VERY_VERBOSE
  log_level: "DEBUG"
  # Enable or disable the use of IPv6 networking on the device
  ipv6_enable: "false"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  min_version: 2026.10.0

preferences:
  id: preferences_component
  flash_write_interval: 1min

api:
  id: api_component
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 180min

ota:
  - platform: esphome
    id: ota_esphome
    # Encrypted OTA only, using the device's api: encryption key (no password).
    encryption:

logger:
  id: logger_component
  baud_rate: 0  # 0 Enables logging, but disables serial-port logging to free CPU and memory
  level: ${log_level}

mdns:
  id: mdns_component
  disabled: false

web_server:
  # https://esphome.io/components/web_server/
  id: web_server_component
  port: 80
  auth:
    type: digest
    username: !secret web_username
    password: !secret web_password
  version: 3

network:
  id: network_component
  enable_ipv6: ${ipv6_enable}

wifi:
  id: wifi_component
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback hotspot if Wi-Fi fails
  ap:
    ssid: "${name} FBHS"
    password: !secret ap_password
  # Allow rapid re-connection to previously connect WiFi SSID, skipping scan of all SSID
  fast_connect: "${wifi_fast_connect}"
  # Define dns domain / suffix to add to hostname
  domain: "${dns_domain}"

captive_portal:
  id: captive_portal_component

binary_sensor:
  - platform: status
    name: "Status"
    id: id_status
    icon: mdi:check-network-outline
    entity_category: diagnostic

sensor:
  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    type:
      timestamp
    entity_category: "diagnostic"

  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    id: wifi_signal_percent
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    entity_category: "diagnostic"
    device_class: ""

button:
  - platform: restart
    name: "Restart"
    id: id_restart
    entity_category: config

  - platform: factory_reset
    name: "Factory Reset"
    id: Reset
    entity_category: config

  - platform: safe_mode
    name: "Safe Mode"
    id: id_safe_mode
    internal: false
    entity_category: config

text_sensor:
  - platform: version
    name: "ESPHome Version"
    id: esphome_version
    hide_timestamp: true
    entity_category: diagnostic

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_address
      icon: mdi:ip-network
      entity_category: diagnostic
    ssid:
      name: "Connected SSID"
      id: ssid
      icon: mdi:wifi-strength-2
      entity_category: diagnostic
    mac_address:
      name: "Mac Address"
      id: mac_address
      icon: mdi:network-pos
      entity_category: diagnostic

  #  Creates a sensor showing when the device was last restarted
  - platform: template
    name: 'Last Restart'
    id: device_last_restart
    icon: mdi:clock
    entity_category: diagnostic

time:
  # https://esphome.io/components/time/homeassistant/
  - platform: homeassistant
    id: homeassistant_time
    # Publish the time the device was last restarted
    on_time_sync:
      then:
        # Update last restart time, but only once.
        - if:
            condition:
              lambda: 'return id(device_last_restart).state == "";'
            then:
              - text_sensor.template.publish:
                  id: device_last_restart
                  state: !lambda 'return id(homeassistant_time).now().strftime("%a %d %b %Y - %I:%M:%S %p");'
